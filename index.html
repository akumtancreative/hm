        // --- STATE MANAJEMEN ---
        let employees = [];

        // Load Data dari Local Storage (atau pakai initialData jika kosong)
        function loadData() {
            const stored = localStorage.getItem('karyawanData_v3');
            if (stored) {
                employees = JSON.parse(stored);
            } else {
                employees = [...initialData];
                saveData();
            }
            renderSidebar();
            renderTable();
            lucide.createIcons();
        }

        function saveData() {
            localStorage.setItem('karyawanData_v3', JSON.stringify(employees));
            renderTable(); // Re-render untuk update tampilan jika perlu
        }

        function resetData() {
            if(confirm("Apakah Anda yakin ingin mereset semua data kembali ke awal? Data yang sudah diubah akan hilang.")) {
                localStorage.removeItem('karyawanData_v3');
                location.reload();
            }
        }

        // --- RENDER SIDEBAR ---
        function renderSidebar() {
            const list = document.getElementById('sectorList');
            list.innerHTML = '';
            sectors.forEach(sector => {
                const btn = document.createElement('button');
                const isActive = activeSector === sector;
                btn.className = `w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-all ${isActive ? 'bg-[#178593] text-white shadow-md translate-x-1' : 'text-gray-300 hover:bg-[#126a75] hover:text-white'}`;
                btn.innerHTML = `<i data-lucide="map-pin" width="18"></i> ${sector}`;
                btn.onclick = () => {
                    activeSector = sector;
                    renderSidebar();
                    renderTable();
                    lucide.createIcons();
                    // Di mobile, tutup sidebar setelah klik
                    if(window.innerWidth < 768) document.getElementById('sidebar').classList.add('hidden');
                };
                list.appendChild(btn);
            });
        }

        // --- RENDER TABEL ---
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            // Filter Data
            const filteredData = employees.filter(emp => emp.sector === activeSector);
            
            // Update Header Title & Badge
            document.getElementById('activeSectorTitle').innerText = activeSector;
            document.getElementById('countBadge').innerText = filteredData.length + " Personel";

            if (filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="14" class="p-8 text-center text-gray-400 italic">Belum ada data di sektor ini.</td></tr>`;
                return;
            }

            filteredData.forEach((emp, index) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-blue-50/30 transition-colors group";
                
                // Helper untuk membuat select
                const createSelect = (field, options, colorize = false) => {
                    let colorClass = "text-slate-700";
                    if(colorize) {
                        if(emp[field] === "✔" || emp[field] === "K") colorClass = "text-green-600 font-bold";
                        if(emp[field] === "✕" || emp[field] === "P") colorClass = "text-red-500 font-bold";
                        if(field === "kp" && emp[field] === "K") colorClass = "bg-blue-100 text-blue-700 px-2 py-0.5 rounded";
                        if(field === "kp" && emp[field] === "P") colorClass = "bg-pink-100 text-pink-700 px-2 py-0.5 rounded";
                    }

                    return `<select onchange="updateRow(${emp.id}, '${field}', this.value)" class="w-full bg-transparent border-none focus:ring-2 focus:ring-[#178593] rounded cursor-pointer text-center outline-none ${colorClass}">
                        ${options.map(opt => `<option value="${opt}" ${emp[field] === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                    </select>`;
                };

                // Helper untuk input text
                const createInput = (field, width = "w-full") => {
                    return `<input type="text" value="${emp[field] || ''}" onchange="updateRow(${emp.id}, '${field}', this.value)" class="${width} px-2 py-1 bg-transparent border border-transparent hover:border-gray-300 focus:border-[#178593] rounded focus:bg-white transition-all outline-none">`;
                };

                tr.innerHTML = `
                    <td class="p-2 text-center text-slate-400 font-medium border-r border-gray-100">${index + 1}</td>
                    <td class="p-2 border-r border-gray-100">${createInput('nama')}</td>
                    <td class="p-2 text-center border-r border-gray-100">${createSelect('kp', optionsKP, true)}</td>
                    <td class="p-2 text-center border-r border-gray-100">${createSelect('kursus', optionsKursus, true)}</td>
                    <td class="p-2 text-center border-r border-gray-100">${createSelect('kontrol', optionsCheck, true)}</td>
                    <td class="p-2 border-r border-gray-100">${createInput('kontak')}</td>
                    <td class="p-2 text-center border-r border-gray-100">${createSelect('lapGuru', optionsCheck, true)}</td>
                    <td class="p-2 text-center border-r border-gray-100">${createSelect('hs', optionsCheck, true)}</td>
                    <td class="p-2 text-center border-r border-gray-100">${createSelect('jm', optionsCheck, true)}</td>
                    <td class="p-2 text-center border-r border-gray-100">${createSelect('spp', optionsCheck, true)}</td>
                    <td class="p-2 border-r border-gray-100 text-center">${createInput('buletinCetak')}</td>
                    <td class="p-2 border-r border-gray-100 text-center">${createInput('buletinDigital')}</td>
                    <td class="p-2 border-r border-gray-100">${createInput('kajian')}</td>
                    <td class="p-2 text-center">
                        <button onclick="deleteRow(${emp.id})" class="text-gray-300 hover:text-red-500 transition-colors p-1 rounded hover:bg-red-50">
                            <i data-lucide="trash-2" width="16"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            lucide.createIcons();
        }

        // --- FUNGSI INTERAKSI ---
        function updateRow(id, field, value) {
            const empIndex = employees.findIndex(e => e.id === id);
            if (empIndex > -1) {
                employees[empIndex][field] = value;
                saveData();
                // Opsional: Render ulang jika status K/P berubah agar warna berubah
                if(field === 'kp' || field === 'kontrol') renderTable(); 
            }
        }

        function addNewRow() {
            const newId = Date.now();
            employees.push({
                id: newId,
                sector: activeSector,
                nama: "", kp: "K", kursus: "-", kontrol: "-", kontak: "", lapGuru: "-", 
                hs: "-", jm: "-", spp: "-", buletinCetak: "-", buletinDigital: "-", kajian: "-"
            });
            saveData();
            renderTable();
        }

        function deleteRow(id) {
            if(confirm("Hapus baris ini?")) {
                employees = employees.filter(e => e.id !== id);
                saveData();
                renderTable();
            }
        }

        function exportToExcel() {
            const filtered = employees.filter(emp => emp.sector === activeSector);
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "No,Sektor,Nama,K/P,Kursus,Kontrol,Kontak,Lap. Guru,HS,JM,SPP,Buletin Cetak,Buletin Digital,Kajian\n";
            
            filtered.forEach((row, index) => {
                const rowString = [
                    index + 1, row.sector, `"${row.nama}"`, row.kp, row.kursus, row.kontrol, `'${row.kontak}`,
                    row.lapGuru, row.hs, row.jm, row.spp, `"${row.buletinCetak}"`, `"${row.buletinDigital}"`, `"${row.kajian}"`
                ].join(",");
                csvContent += rowString + "\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Data_${activeSector}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('hidden');
        }

        // --- INITIALIZE ---
        window.onload = loadData;

    </script>

    // Attach event listeners
    attachEventListeners() {
        document.getElementById('githubSyncBtn').addEventListener('click', () => this.openModal());
        
        // Enter key untuk connect
        ['githubUsername', 'githubToken', 'githubRepo'].forEach(id => {
            document.getElementById(id)?.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') this.connect();
            });
        });
    },

    // Open Modal
    openModal() {
        document.getElementById('githubModal').classList.remove('hidden');
        this.updateConnectionStatus();
        lucide.createIcons();
    },

    // Close Modal
    closeModal() {
        document.getElementById('githubModal').classList.add('hidden');
    },

    // Update connection status UI
    updateConnectionStatus() {
        const loginForm = document.getElementById('loginForm');
        const actionButtons = document.getElementById('actionButtons');
        const connectionStatus = document.getElementById('connectionStatus');
        const connectedRepo = document.getElementById('connectedRepo');

        if (this.state.isConnected) {
            loginForm.classList.add('hidden');
            actionButtons.classList.remove('hidden');
            connectionStatus.classList.remove('hidden');
            connectedRepo.textContent = `${this.state.username}/${this.state.repoName}`;
        } else {
            loginForm.classList.remove('hidden');
            actionButtons.classList.add('hidden');
            connectionStatus.classList.add('hidden');
        }
    },

    // Show status message
    showMessage(message, type = 'info') {
        const statusMessage = document.getElementById('statusMessage');
        statusMessage.className = `mt-4 p-3 rounded-lg text-sm ${
            type === 'success' ? 'bg-green-100 text-green-800 border border-green-200' :
            type === 'error' ? 'bg-red-100 text-red-800 border border-red-200' :
            'bg-blue-100 text-blue-800 border border-blue-200'
        }`;
        statusMessage.textContent = message;
        statusMessage.classList.remove('hidden');
        
        setTimeout(() => {
            statusMessage.classList.add('hidden');
        }, 5000);
    },

    // Connect to GitHub
    async connect() {
        const username = document.getElementById('githubUsername').value.trim();
        const token = document.getElementById('githubToken').value.trim();
        const repoName = document.getElementById('githubRepo').value.trim();

        if (!username || !token || !repoName) {
            this.showMessage('Semua field harus diisi!', 'error');
            return;
        }

        this.showMessage('Connecting...', 'info');

        try {
            // Verify token dengan user API
            const userResponse = await fetch(`${this.config.apiUrl}/user`, {
                headers: {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json'
                }
            });

            if (!userResponse.ok) {
                throw new Error('Token tidak valid atau expired');
            }

            const userData = await userResponse.json();
            
            if (userData.login.toLowerCase() !== username.toLowerCase()) {
                throw new Error('Username tidak sesuai dengan token');
            }

            // Check if repo exists, jika tidak buat baru
            const repoResponse = await fetch(`${this.config.apiUrl}/repos/${username}/${repoName}`, {
                headers: {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json'
                }
            });

            if (repoResponse.status === 404) {
                // Buat repo baru
                await this.createRepository(token, repoName);
            } else if (!repoResponse.ok) {
                throw new Error('Gagal mengakses repository');
            }

            // Save credentials
            this.state.token = token;
            this.state.username = username;
            this.state.repoName = repoName;
            this.state.isConnected = true;
            this.saveCredentials();

            this.showMessage('✓ Berhasil terhubung ke GitHub!', 'success');
            this.updateConnectionStatus();
            lucide.createIcons();

        } catch (error) {
            this.showMessage(`Error: ${error.message}`, 'error');
            console.error('GitHub connection error:', error);
        }
    },

    // Create new repository
    async createRepository(token, repoName) {
        const response = await fetch(`${this.config.apiUrl}/user/repos`, {
            method: 'POST',
            headers: {
                'Authorization': `token ${token}`,
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                name: repoName,
                description: 'Data Karyawan Backup',
                private: true,
                auto_init: true
            })
        });

        if (!response.ok) {
            throw new Error('Gagal membuat repository baru');
        }

        // Tunggu sebentar agar repo siap
        await new Promise(resolve => setTimeout(resolve, 2000));
    },

    // Save data to GitHub
    async saveToGitHub() {
        if (!this.state.isConnected) {
            this.showMessage('Belum terhubung ke GitHub!', 'error');
            return;
        }

        this.showMessage('Uploading data...', 'info');

        try {
            // Ambil data karyawan dari localStorage
            const data = localStorage.getItem('karyawanData_v3');
            if (!data) {
                throw new Error('Tidak ada data untuk disimpan');
            }

            // Format data dengan timestamp
            const payload = {
                version: '3.0',
                lastUpdated: new Date().toISOString(),
                employees: JSON.parse(data)
            };

            const content = btoa(unescape(encodeURIComponent(JSON.stringify(payload, null, 2))));

            // Check if file already exists
            let sha = null;
            try {
                const checkResponse = await fetch(
                    `${this.config.apiUrl}/repos/${this.state.username}/${this.state.repoName}/contents/${this.config.fileName}`,
                    {
                        headers: {
                            'Authorization': `token ${this.state.token}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    }
                );
                if (checkResponse.ok) {
                    const fileData = await checkResponse.json();
                    sha = fileData.sha;
                }
            } catch (e) {
                // File doesn't exist, that's okay
            }

            // Upload/update file
            const uploadResponse = await fetch(
                `${this.config.apiUrl}/repos/${this.state.username}/${this.state.repoName}/contents/${this.config.fileName}`,
                {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${this.state.token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `${this.config.commitMessage} - ${new Date().toLocaleString('id-ID')}`,
                        content: content,
                        ...(sha && { sha })
                    })
                }
            );

            if (!uploadResponse.ok) {
                throw new Error('Gagal upload data ke GitHub');
            }

            const result = await uploadResponse.json();
            this.showMessage('✓ Data berhasil disimpan ke GitHub!', 'success');
            
            // Tambahkan link ke file
            setTimeout(() => {
                this.showMessage(`View: ${result.content.html_url}`, 'success');
            }, 2000);

        } catch (error) {
            this.showMessage(`Error: ${error.message}`, 'error');
            console.error('GitHub save error:', error);
        }
    },

    // Load data from GitHub
    async loadFromGitHub() {
        if (!this.state.isConnected) {
            this.showMessage('Belum terhubung ke GitHub!', 'error');
            return;
        }

        if (!confirm('Load data dari GitHub akan menimpa data lokal saat ini. Lanjutkan?')) {
            return;
        }

        this.showMessage('Downloading data...', 'info');

        try {
            const response = await fetch(
                `${this.config.apiUrl}/repos/${this.state.username}/${this.state.repoName}/contents/${this.config.fileName}`,
                {
                    headers: {
                        'Authorization': `token ${this.state.token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                }
            );

            if (!response.ok) {
                throw new Error('File tidak ditemukan di GitHub');
            }

            const fileData = await response.json();
            const content = decodeURIComponent(escape(atob(fileData.content)));
            const payload = JSON.parse(content);

            // Validasi structure
            if (!payload.employees || !Array.isArray(payload.employees)) {
                throw new Error('Format data tidak valid');
            }

            // Save ke localStorage
            localStorage.setItem('karyawanData_v3', JSON.stringify(payload.employees));
            
            this.showMessage('✓ Data berhasil dimuat dari GitHub!', 'success');
            
            // Reload page untuk apply data baru
            setTimeout(() => {
                location.reload();
            }, 1500);

        } catch (error) {
            this.showMessage(`Error: ${error.message}`, 'error');
            console.error('GitHub load error:', error);
        }
    },

    // Disconnect
    disconnect() {
        if (confirm('Disconnect dari GitHub? Credentials akan dihapus.')) {
            this.clearCredentials();
            this.updateConnectionStatus();
            this.showMessage('Disconnected from GitHub', 'info');
        }
    }
};
